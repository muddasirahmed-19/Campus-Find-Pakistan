name: campusfind_pk
description: Campus Lost & Found App for Pakistani Universities
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1

  # ── Firebase ──────────────────────────────────────────────
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_messaging: ^14.7.19
  firebase_analytics: ^10.8.9
  firebase_storage: ^11.6.10       # fallback small files

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────
  go_router: ^13.2.0

  # ── UI & Fonts ────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.0
  badges: ^3.1.2

  # ── Image Handling ────────────────────────────────────────
  image_picker: ^1.0.7
  image_cropper: ^7.0.2
  cloudinary_flutter: 1.3.0
  cloudinary_url_gen: ^1.5.0

  # ── Phone Input & OTP ─────────────────────────────────────
  intl_phone_field: ^3.2.0
  pinput: ^5.0.0

  # ── Validation & Security ─────────────────────────────────
  form_validator: ^2.1.1
  crypto: ^3.0.3

  # ── Chat ──────────────────────────────────────────────────
  dash_chat_2: ^0.0.21

  # ── Notifications ─────────────────────────────────────────
  flutter_local_notifications: ^17.0.0

  # ── Utilities ─────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.3.3
  timeago: ^3.6.1
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.0
  url_launcher: ^6.2.6
  share_plus: ^9.0.0
  package_info_plus: ^8.0.0

  # ── Local Storage ─────────────────────────────────────────
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_foreground: "assets/icons/foreground.png"
  adaptive_icon_background: "assets/icons/background.png"
  remove_alpha_ios: true